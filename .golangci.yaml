---
# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
linters:
    fast: false
    enable:
        - gocritic
        - godox
        - gosec
        - grouper
        - lll
        - nilerr
        - nlreturn
        - noctx
        - nosprintfhostport
        - paralleltest
        - prealloc
        - reassign
        - revive
        - sloglint
        - unconvert
        - wrapcheck
linters-settings:
    gosec:
        excludes:
            - G115
    wrapcheck:
        ignoreSigs:
            - .Errorf(
            - errors.New(
            - errors.Unwrap(
            - errors.Join(
            - .Wrap(
            - .Wrapf(
            - .WithMessage(
            - .WithMessagef(
            - .WithStack(
            - (context.Context).Err(
