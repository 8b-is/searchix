---
# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
linters:
    enable:
        - gocritic
        - godox
        - gosec
        - grouper
        - lll
        - nilerr
        - nlreturn
        - noctx
        - nosprintfhostport
        - paralleltest
        - prealloc
        - reassign
        - revive
        - sloglint
        - unconvert
        - wrapcheck
    settings:
        gosec:
            excludes:
                - G115
        paralleltest:
            ignore-missing: true
        wrapcheck:
            ignore-sigs:
                - .Errorf(
                - errors.New(
                - errors.Unwrap(
                - errors.Join(
                - .Wrap(
                - .Wrapf(
                - .WithMessage(
                - .WithMessagef(
                - .WithStack(
                - (context.Context).Err(
    exclusions:
        generated: lax
        presets:
            - comments
            - common-false-positives
            - legacy
            - std-error-handling
        rules:
            - linters:
                  - revive
              path: internal/components
              text: dot-imports
        paths:
            - third_party$
            - builtin$
            - examples$
formatters:
    exclusions:
        generated: lax
        paths:
            - third_party$
            - builtin$
            - examples$
